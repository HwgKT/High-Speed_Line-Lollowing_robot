name: One-time import of mainHighSpeed into mainv1
on:
  push:
    branches:
      - mainv1
    paths:
      - .github/workflows/import-mainv1.yml
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Replace the complete tree with source branch
        shell: bash
        run: |
          set -euo pipefail
          git remote add source https://github.com/HwgKT/doline17s.git
          git fetch --no-tags source refs/heads/mainHighSpeed:refs/remotes/source/mainHighSpeed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u refs/remotes/source/mainHighSpeed
          if git diff --cached --quiet; then
            echo "Destination already matches source."
            exit 0
          fi
          git commit -m "Import exact mainHighSpeed snapshot from HwgKT/doline17s"
          git push origin HEAD:refs/heads/mainv1
