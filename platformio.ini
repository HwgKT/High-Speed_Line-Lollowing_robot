
; [env:esp32doit-devkit-v1]
; platform = espressif32@6.12.0
; board = esp32doit-devkit-v1
; framework = arduino
; monitor_speed = 115200
; upload_speed = 115200

; ; Nếu bạn dùng board ESP32 DevKit V1, có thể bật tùy chọn này nếu cần gỡ lỗi USB:
; ; monitor_port = /dev/cu.usbserial-*
; ; upload_port = /dev/cu.usbserial-*

; build_flags =
;     -DCORE_DEBUG_LEVEL=0

; Bluetooth Classic CHỈ chạy trên ESP32 gốc (esp32dev, esp32doit-devkit-v1...),
; KHÔNG chạy trên esp32-s3 / esp32-c3 / esp32-c6.

[env:esp32dev]
platform = espressif32@6.12.0
build_src_filter = +<*> -<ble_control.cpp>
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Stack Bluetooth Classic rất nặng: đổi partition để đủ flash (~3MB app, không OTA)
board_build.partitions = huge_app.csv

; Không cần lib_deps cho BluetoothSerial (có sẵn trong framework).